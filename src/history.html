<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: https:;">
    <title>Historique - Domus Browser</title>
    <style>
        :root {
            --bg-dark: #050506;
            --bg-panel: #0d0d10;
            --bg-card: #14141a;
            --accent: #00ff88;
            --text-main: #ffffff;
            --text-dim: #8e8e93;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ff3b30;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --max-content-width: 900px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* --- EN-TÊTE FIXE (STICKY HEADER) --- */
        header {
            background: rgba(13, 13, 16, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 30px 5%;
            display: flex;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            width: 100%;
            max-width: var(--max-content-width);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .icon-title {
            font-size: 2.5rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
            justify-content: flex-end;
        }

        /* Barre de recherche d'historique */
        .search-box {
            position: relative;
            max-width: 350px;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: white;
            padding: 12px 15px 12px 40px;
            border-radius: 10px;
            outline: none;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
            font-size: 1rem;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
            background: transparent;
        }

        .btn-danger {
            color: var(--danger);
            border-color: rgba(255, 59, 48, 0.3);
        }

        .btn-danger:hover {
            background: rgba(255, 59, 48, 0.1);
        }

        /* --- ZONE DE CONTENU (LISTE HISTORIQUE) --- */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 40px 5% 100px;
            display: flex;
            justify-content: center;
        }

        /* Personnalisation de la barre de défilement */
        main::-webkit-scrollbar {
            width: 8px;
        }

        main::-webkit-scrollbar-track {
            background: transparent;
        }

        main::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        main::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .history-container {
            width: 100%;
            max-width: var(--max-content-width);
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .date-group {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .date-header {
            font-size: 1rem;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .history-list {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .history-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            transition: var(--transition);
            gap: 15px;
            text-decoration: none;
            color: inherit;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.03);
            transform: translateX(4px);
        }

        .item-time {
            color: var(--text-dim);
            font-size: 0.85rem;
            min-width: 60px;
        }

        .item-favicon {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .item-details {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .item-title {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-url {
            color: var(--text-dim);
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-actions {
            opacity: 0;
            transition: var(--transition);
        }

        .history-item:hover .item-actions {
            opacity: 1;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: var(--transition);
            font-size: 1.1rem;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-icon.delete:hover {
            background: rgba(255, 59, 48, 0.15);
            color: var(--danger);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            opacity: 0.5;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <div class="title-area">
                <span class="icon-title">🕒</span>
                <h1>Historique</h1>
            </div>
            <div class="header-actions">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Rechercher dans l'historique...">
                </div>
                <button class="btn btn-danger" id="clearHistoryBtn">Effacer les données</button>
            </div>
        </div>
    </header>

    <main>
        <div class="history-container" id="history-container">
            <div class="empty-state" id="loading-state">
                <p>Chargement de vos données temporelles...</p>
            </div>
        </div>
    </main>

    <script>
        const container = document.getElementById('history-container');
        const searchInput = document.getElementById('searchInput');
        let fullHistoryData = []; // Stockage de la VRAIE base de données

        // --- MOTEUR DE DATES INTELLIGENT ---
        // Convertit un timestamp "brut" en mots (Hier, Aujourd'hui)
        function formatRelativeDate(timestamp) {
            const date = new Date(timestamp);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (date.toDateString() === today.toDateString()) return "Aujourd'hui";
            if (date.toDateString() === yesterday.toDateString()) return "Hier";

            // Format normal : "mardi 15 octobre"
            return date.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
        }

        // Convertit le timestamp en heure HH:MM
        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        // Un petit embellisseur d'icône basé sur l'URL
        function getFaviconEmoji(url) {
            if (!url) return '🌐';
            const lowerUrl = url.toLowerCase();
            if (lowerUrl.includes('github.com')) return '🐙';
            if (lowerUrl.includes('youtube.com')) return '📺';
            if (lowerUrl.includes('wikipedia.org')) return 'W';
            if (lowerUrl.includes('192.168.') || lowerUrl.includes('10.')) return '🖧'; // Ton réseau local (Proxmox/Jellyfin)
            if (lowerUrl.includes('google.com')) return '🔍';
            return '🌐';
        }

        // --- MOTEUR D'AFFICHAGE (RENDER) ---
        function renderHistory(data) {
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h2>Aucun historique trouvé</h2>
                        <p style="margin-top: 10px;">Votre navigation est un mystère absolu.</p>
                    </div>
                `;
                return;
            }

            // Grouper intelligemment par date (Aujourd'hui, Hier...)
            const groupedData = data.reduce((groups, item) => {
                const groupName = formatRelativeDate(item.timestamp);
                if (!groups[groupName]) groups[groupName] = [];
                groups[groupName].push(item);
                return groups;
            }, {});

            // Génération du HTML final
            for (const [groupName, items] of Object.entries(groupedData)) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'date-group';

                const header = document.createElement('div');
                header.className = 'date-header';
                header.innerHTML = `<span>${groupName}</span> <span>${items.length} visite(s)</span>`;
                groupDiv.appendChild(header);

                const list = document.createElement('div');
                list.className = 'history-list';

                items.forEach(item => {
                    const itemEl = document.createElement('a');
                    itemEl.href = "#";
                    itemEl.className = 'history-item';
                    itemEl.onclick = (e) => {
                        // Si on clique ailleurs que sur la poubelle, ça ouvre le site
                        if (!e.target.closest('.delete')) {
                            e.preventDefault();
                            if (window.domusAPI && window.domusAPI.navigate) {
                                window.domusAPI.navigate(item.url);
                            }
                        }
                    };

                    itemEl.innerHTML = `
                        <div class="item-time">${formatTime(item.timestamp)}</div>
                        <div class="item-favicon">${getFaviconEmoji(item.url)}</div>
                        <div class="item-details">
                            <span class="item-title">${item.title}</span>
                            <span class="item-url">${item.url}</span>
                        </div>
                        <div class="item-actions">
                            <button class="btn-icon delete" title="Supprimer de l'historique" data-id="${item.id}">🗑️</button>
                        </div>
                    `;

                    // Gestion de la suppression réelle dans la base de données JSON
                    const delBtn = itemEl.querySelector('.delete');
                    delBtn.onclick = async (e) => {
                        e.stopPropagation();
                        itemEl.style.opacity = '0'; // Animation de disparition douce

                        setTimeout(async () => {
                            // Appel au pont sécurisé pour supprimer physiquement l'élément
                            if (window.domusAPI) {
                                await window.domusAPI.deleteHistoryItem(item.id);
                                fullHistoryData = fullHistoryData.filter(i => i.id !== item.id);
                            }
                            itemEl.remove(); // Supprime du DOM
                            if (list.children.length === 0) groupDiv.remove(); // Supprime le groupe si vide
                        }, 250);
                    };

                    list.appendChild(itemEl);
                });

                groupDiv.appendChild(list);
                container.appendChild(groupDiv);
            }
        }

        // Écouteur pour la barre de recherche
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filteredData = fullHistoryData.filter(item =>
                item.title.toLowerCase().includes(query) ||
                item.url.toLowerCase().includes(query)
            );
            renderHistory(filteredData);
        });

        // Écouteur pour le gros bouton "Effacer les données"
        document.getElementById('clearHistoryBtn').addEventListener('click', async () => {
            if (confirm("🚨 Êtes-vous sûr de vouloir purger TOUT votre historique de navigation ? Cette action est irréversible et détruira le fichier de données.")) {
                if (window.domusAPI) {
                    await window.domusAPI.clearHistory(); // Détruit le fichier côté système
                }
                fullHistoryData = [];
                renderHistory([]); // Met à jour l'affichage avec l'écran vide
            }
        });

        // Chargement automatique de tes vraies données au démarrage
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.domusAPI) {
                // On récupère le vrai historique enregistré par ton Domus Browser
                fullHistoryData = await window.domusAPI.getHistory();
                renderHistory(fullHistoryData);
            } else {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h2>Erreur de connexion au noyau.</h2></div>';
            }
        });

    </script>
</body>

</html>
