<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur de Chargement - Domus Browser Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050508;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.25);
            --text-main: #ffffff;
            --text-dim: #8e8e93;
            --glass-bg: rgba(13, 13, 18, 0.65);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-hover-border: rgba(0, 255, 136, 0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #0e0e14 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        .container {
            max-width: 500px;
            width: 90%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s ease;
        }
        .icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 0.95rem;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .details-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 30px;
            text-align: left;
        }
        .details-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .error-desc {
            font-size: 0.85rem;
            font-family: monospace;
            color: #ff5555;
            word-break: break-all;
        }
        .url-text {
            font-size: 0.85rem;
            color: #aaa;
            word-break: break-all;
            margin-top: 5px;
        }
        .btn-retry {
            background: var(--accent);
            border: none;
            color: #050508;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
            text-decoration: none;
            display: inline-block;
        }
        .btn-retry:hover {
            box-shadow: 0 4px 25px rgba(0, 255, 136, 0.6);
            transform: translateY(-2px);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Impossible d'accéder à la page</h1>
        <p>Domus Browser Pro n'a pas pu charger la page demandée. Veuillez vérifier votre connexion Internet ou réessayer plus tard.</p>
        
        <div class="details-box">
            <div class="details-title">Détails de l'erreur</div>
            <div class="error-desc" id="err-desc">ERR_CONNECTION_REFUSED</div>
            <div class="url-text" id="err-url">https://example.com</div>
        </div>

        <button class="btn-retry" id="btn-retry">Réessayer le chargement</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const errorDesc = params.get('error') || 'Erreur réseau inconnue';
        const url = params.get('url') || '';
        
        document.getElementById('err-desc').textContent = errorDesc;
        document.getElementById('err-url').textContent = url;

        document.getElementById('btn-retry').onclick = () => {
            if (url) {
                window.location.href = url;
            } else {
                window.history.back();
            }
        };
    </script>
</body>
</html>
